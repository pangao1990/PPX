name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build workflow run ID for the exact source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  distribution:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify successful three-platform build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'build-run.json').read_text())
          assert run['path'] == '.github/workflows/main.yml', 'Not the build workflow'
          assert run['event'] in ('push', 'workflow_dispatch'), 'Untrusted build event'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] == 'main'
          assert run['head_sha'] == os.environ['GITHUB_SHA'], 'Commit differs from tested build'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          print('Verified successful build:', run['html_url'])
          PY
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip==26.2.1 build twine packaging
          python -m build --outdir dist/release ppx/packages/ppx-py
          npm pack ./ppx/packages/ppx-js --pack-destination dist/release --ignore-scripts
          python ppx/tooling/scripts/check_release.py --dist dist/release
          python -m twine check dist/release/*.whl dist/release/*.tar.gz
          rm dist/release/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/release/
          if-no-files-found: error

  publish:
    needs: distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ppx-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
